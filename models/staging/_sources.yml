version: 2

sources:
  - name: raw
    database: "{{ env_var('DBT_DATABASE', 'DBT_DEV') }}"
    schema: raw
    tables:
      - name: customers
        columns:
          - name: customer_id
            tests:
              - unique
              - not_null
      - name: orders
        columns:
          - name: order_id
            tests:
              - unique
              - not_null
